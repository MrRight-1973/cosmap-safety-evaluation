<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety evaluation</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --mute:#5d6b7c; --line:#d9dee5; --acc:#0b6bcb; --ok:#1a7f4b; --warn:#9a5c00; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14181d; --card:#1c2229; --ink:#e8ecf1; --mute:#93a0b0; --line:#313a45; --acc:#5aa7f5; --ok:#4cc38a; --warn:#e8a33d; --bad:#ff7a70; }
  }
  :root[data-theme="dark"] { --bg:#14181d; --card:#1c2229; --ink:#e8ecf1; --mute:#93a0b0; --line:#313a45; --acc:#5aa7f5; --ok:#4cc38a; --warn:#e8a33d; --bad:#ff7a70; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,"Segoe UI",sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  .hwrap { max-width:1040px; margin:0 auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .hwrap b { margin-right:10px; }
  nav { display:flex; flex-wrap:wrap; gap:4px; }
  nav button { border-radius:99px; }
  nav button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  main { max-width:1040px; margin:0 auto; padding:18px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:16px; margin:0 0 10px; }
  h3 { font-size:14px; margin:12px 0 6px; }
  .sub { color:var(--mute); margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px 14px; }
  label { display:block; font-size:13px; color:var(--mute); }
  input, select, textarea { width:100%; padding:6px 8px; margin-top:3px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
  textarea { min-height:56px; resize:vertical; }
  .chk { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:14px; margin:4px 0; }
  .chk input { width:auto; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mute); font-weight:600; font-size:12px; }
  td input, td select { margin:0; min-width:70px; }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); font:inherit; cursor:pointer; }
  button.p { background:var(--acc); border-color:var(--acc); color:#fff; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .spacer { flex:1; }
  .note { font-size:12.5px; color:var(--mute); margin:8px 0 0; }
  .pill { display:inline-block; padding:1px 10px; border-radius:99px; font-weight:700; border:1px solid currentColor; }
  tr.sel td { background:var(--bg); }
  details { margin:6px 0; font-size:13.5px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .mute { color:var(--mute); }
  ul.list { margin:6px 0 0; padding-left:18px; font-size:13.5px; }
  .scroll { overflow-x:auto; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tabs button.on { border-color:var(--acc); color:var(--acc); font-weight:600; }
  .big { font-size:24px; font-weight:700; }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; font-size:14px; }
  .kv span:nth-child(odd) { color:var(--mute); }
  @media print {
    header, .noprint { display:none !important; }
    body { background:#fff; color:#000; }
    section { border:none; padding:0; }
  }
</style>
</head>
<body>
<header><div class="hwrap"><b>Safety evaluation</b><nav id="nav"></nav></div></header>
<main id="app"></main>

<script src="engine.js"></script>
<script src="articoli.js"></script>
<script src="archivio.js"></script>
<script src="sistema.js"></script>
<script src="vdma.js"></script>
<script src="zip.js"></script>
<script>
'use strict';
const E = window.SafetyEngine;
const KEY = 'safety-eval-v1';
const STEPS = [
  [1, 'Progetto e funzioni'], [2, 'Architettura'], [3, 'Componenti'],
  [4, 'Calcolo'], [5, 'Verifica'], [6, 'Report'], ['db', 'Archivio articoli'],
];
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => (v === '' || v == null ? null : Number(v));
const fmt = (n, d = 2) => (n == null || isNaN(n) ? '—' : n.toLocaleString('it-IT', { maximumFractionDigits: d }));

function defaultState() {
  return {
    step: 1, fSel: 0,
    progetto: { nome: '', macchina: '', autore: '', data: new Date().toISOString().slice(0, 10), missionTime: 20 },
    funzioni: [],
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
if (!S) S = defaultState();
function save() { try { const { articoli, ...rest } = S; localStorage.setItem(KEY, JSON.stringify(rest)); } catch (e) {} }

// ---- archivio articoli: su file tramite il server locale (npm start), altrimenti nel browser ----
const ARCH_KEY = 'safety-eval-articoli';
let A = [];                       // archivio articoli
const DB = { mode: 'browser', file: null, saved: '', error: null, timer: null };
const UI = { testo: '', produttore: '', tipo: '', daVerificare: false, limite: 100, edit: null, importa: null };
async function loadArchive() {
  const vecchio = Array.isArray(S.articoli) ? S.articoli : null; // versioni precedenti: archivio dentro lo stato
  delete S.articoli;
  let arch = null;
  try {
    const r = await fetch('api/articoli', { cache: 'no-store' });
    if (r.ok) { const d = await r.json(); DB.mode = 'server'; DB.file = d.file; arch = d.articoli; }
  } catch (e) { /* aperto come file: niente server */ }
  DB.saved = arch ? JSON.stringify(arch) : '';
  // primo avvio col server: si parte da quanto già salvato nel browser
  if (!arch) { try { arch = JSON.parse(localStorage.getItem(ARCH_KEY) || 'null'); } catch (e) {} }
  if (!arch) arch = vecchio;
  A = window.Archivio.conDefault(arch || [], window.ARTICOLI_DEFAULT || []);
}
// Immagini degli articoli: con il server in data/immagini/, altrimenti nel browser (se c'è spazio)
const IMG_KEY = 'safety-eval-immagini';
let IMG = {};
try { IMG = JSON.parse(localStorage.getItem(IMG_KEY) || '{}'); } catch (e) { IMG = {}; }
const imgSrc = a => !a || !a.immagine ? null : DB.mode === 'server' ? 'api/immagini/' + a.immagine : IMG[a.immagine] || null;
const thumb = (a, px = 40) => { const src = imgSrc(a); return src ? h('img', { src, alt: '', loading: 'lazy', style: `width:${px}px;height:${px}px;object-fit:contain;vertical-align:middle` }) : null; };
async function salvaImmagini(immagini) {
  if (DB.mode === 'server') {
    for (const [chiave, { byte, tipo }] of immagini) {
      const r = await fetch('api/immagini/' + chiave, { method: 'PUT', headers: { 'Content-Type': tipo }, body: byte });
      // 404: il server in esecuzione è precedente all'archivio immagini (avviato prima di git pull)
      if (r.status === 404) throw new Error('Immagini non salvate: il server è di una versione precedente. Chiudi la finestra di npm start, rilancialo e reimporta il pacchetto.');
      if (!r.ok) throw new Error(`immagine ${chiave} non salvata`);
    }
    return true;
  }
  const nuove = { ...IMG };
  for (const [chiave, { byte, tipo }] of immagini) {
    let bin = '';
    for (let i = 0; i < byte.length; i += 0x8000) bin += String.fromCharCode(...byte.subarray(i, i + 0x8000));
    nuove[chiave] = `data:${tipo};base64,${btoa(bin)}`;
  }
  try { localStorage.setItem(IMG_KEY, JSON.stringify(nuove)); IMG = nuove; return true; } catch (e) { return false; }
}
function saveArchive() {
  const text = JSON.stringify(A);
  if (text === DB.saved) return;
  if (DB.mode === 'browser') { try { localStorage.setItem(ARCH_KEY, text); DB.saved = text; } catch (e) { DB.error = 'Archivio troppo grande per il browser: avvia l\'app con npm start.'; } return; }
  clearTimeout(DB.timer);
  DB.timer = setTimeout(async () => {
    try {
      const r = await fetch('api/articoli', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: text });
      if (!r.ok) throw new Error((await r.json()).errore || r.status);
      DB.saved = text; if (DB.error) { DB.error = null; render(); }
    } catch (e) { DB.error = 'Archivio non salvato sul disco: ' + e.message; render(); }
  }, 400);
}

// ---- piccolo helper per costruire il DOM ----
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
// campo collegato: get() legge il valore, set(v) lo scrive e ridisegna
function field(label, get, set, opt = {}) {
  const type = opt.type || 'text';
  let inp;
  if (opt.options) {
    inp = h('select', { onchange: e => { set(e.target.value || null); render(); } },
      opt.options.map(([v, t]) => h('option', { value: v ?? '', selected: (get() ?? '') === (v ?? '') }, t)));
  } else if (type === 'textarea') {
    inp = h('textarea', { onchange: e => { set(e.target.value); render(); } }, get() || '');
  } else {
    inp = h('input', { type, value: get() ?? '', min: opt.min, step: opt.step, placeholder: opt.placeholder,
      onchange: e => { set(type === 'number' ? num(e.target.value) : e.target.value); render(); } });
  }
  return label ? h('label', {}, label, inp) : inp;
}
function check(label, get, set) {
  return h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: get(), onchange: e => { set(e.target.checked); render(); } }), label);
}
const plPill = (pl, req) => {
  if (!pl) return h('span', { class: 'pill mute' }, 'n.d.');
  const cls = req ? (E.plAtLeast(pl, req) ? 'ok' : 'bad') : '';
  return h('span', { class: 'pill ' + cls }, 'PL ' + pl);
};
const art = id => A.find(a => a.id === id);
const fn = () => S.funzioni[S.fSel];
const evalFn = f => E.evalFunction(f, A, S.progetto.missionTime);

function issues(errors, warns) {
  if (!errors.length && !warns.length) return null;
  return h('ul', { class: 'list' },
    errors.map(e => h('li', { class: 'bad' }, e)), warns.map(w => h('li', { class: 'warn' }, w)));
}
function fnTabs() {
  if (!S.funzioni.length) return h('p', { class: 'warn' }, 'Prima definisci almeno una funzione di sicurezza al passo 1.');
  if (S.fSel >= S.funzioni.length) S.fSel = 0;
  return h('div', { class: 'tabs' }, S.funzioni.map((f, i) =>
    h('button', { class: i === S.fSel ? 'on' : '', onclick: () => { S.fSel = i; render(); } }, f.nome || `Funzione ${i + 1}`)));
}
function navButtons() {
  const i = STEPS.findIndex(s => s[0] === S.step);
  return h('div', { class: 'row noprint' },
    i > 0 && STEPS[i - 1][0] !== 'db' ? h('button', { onclick: () => go(STEPS[i - 1][0]) }, '← ' + STEPS[i - 1][1]) : null,
    h('span', { class: 'spacer' }),
    i < 5 ? h('button', { class: 'p', onclick: () => go(STEPS[i + 1][0]) }, STEPS[i + 1][1] + ' →') : null);
}
function go(step) { S.step = step; render(); window.scrollTo(0, 0); }

// ---- passo 1 ----
const RG = {
  S: [['S1', 'S1: lesione lieve, reversibile'], ['S2', 'S2: lesione grave, irreversibile o morte']],
  F: [['F1', 'F1: esposizione rara o breve'], ['F2', 'F2: esposizione frequente o prolungata']],
  P: [['P1', 'P1: possibile evitare il pericolo'], ['P2', 'P2: quasi impossibile evitarlo']],
};
function step1() {
  const p = S.progetto;
  return [
    h('h1', {}, '1. Progetto e funzioni di sicurezza'),
    h('p', { class: 'sub' }, 'Descrivi la macchina e le funzioni di sicurezza. Il PLr si ricava dal grafo del rischio (ISO 13849-1, allegato A).'),
    h('section', {}, h('h2', {}, 'Progetto'), h('div', { class: 'grid' },
      field('Nome valutazione', () => p.nome, v => p.nome = v),
      field('Macchina / impianto', () => p.macchina, v => p.macchina = v),
      field('Autore', () => p.autore, v => p.autore = v),
      field('Data', () => p.data, v => p.data = v, { type: 'date' }),
      field('Mission time [anni]', () => p.missionTime, v => p.missionTime = v || 20, { type: 'number', min: 1 }))),
    ...S.funzioni.map((f, i) => h('section', {},
      h('div', { class: 'row', style: 'margin-top:0' }, h('h2', { style: 'margin:0' }, `Funzione ${i + 1}`), h('span', { class: 'spacer' }),
        h('span', {}, 'PLr ', h('b', {}, E.plr(f.S, f.F, f.P) || '—')),
        h('button', { onclick: () => { if (confirm('Eliminare la funzione?')) { S.funzioni.splice(i, 1); render(); } } }, 'Elimina')),
      h('div', { class: 'grid', style: 'margin-top:10px' },
        field('Nome', () => f.nome, v => f.nome = v),
        field('Gravità', () => f.S, v => f.S = v, { options: [[null, '—'], ...RG.S] }),
        field('Frequenza ed esposizione', () => f.F, v => f.F = v, { options: [[null, '—'], ...RG.F] }),
        field('Possibilità di evitare', () => f.P, v => f.P = v, { options: [[null, '—'], ...RG.P] })),
      h('div', { style: 'margin-top:10px' }, field('Descrizione (evento che la attiva, reazione, stato sicuro)', () => f.descrizione, v => f.descrizione = v, { type: 'textarea' })))),
    h('div', { class: 'row' }, h('button', { onclick: () => {
      S.funzioni.push({ id: uid(), nome: 'Arresto di emergenza', descrizione: '', S: null, F: null, P: null, sottosistemi: [] });
      render(); } }, 'Aggiungi funzione di sicurezza')),
  ];
}

// ---- passo 2 ----
const RUOLI = [['rilevamento', 'Rilevamento (sensori, pulsanti)'], ['logica', 'Logica (F-CPU, relè di sicurezza)'], ['attuazione', 'Attuazione (azionamenti, contattori)'], ['comunicazione', 'Comunicazione']];
const METODI = [['pfh', 'PFH da certificato del costruttore'], ['arch', 'Architettura designata (MTTFd, DC, CCF)']];
function step2() {
  const f = fn();
  return [
    h('h1', {}, '2. Architettura'),
    h('p', { class: 'sub' }, 'Dividi la funzione in sottosistemi in serie. Se più iniziatori possono attivarla (es. fungo e pannello), dai a ciascuno un nome di percorso diverso: la funzione avrà il PL del percorso peggiore. I sottosistemi senza percorso sono comuni a tutti.'),
    fnTabs(),
    f ? [
      ...f.sottosistemi.map((ss, i) => h('section', {},
        h('div', { class: 'grid' },
          field('Nome sottosistema', () => ss.nome, v => ss.nome = v),
          field('Ruolo', () => ss.ruolo, v => ss.ruolo = v, { options: RUOLI }),
          field('Percorso (vuoto = comune)', () => ss.percorso, v => ss.percorso = v, { placeholder: 'es. Fungo F-DI' }),
          field('Metodo', () => ss.metodo, v => ss.metodo = v, { options: METODI }),
          ss.metodo === 'arch' ? field('Categoria', () => ss.categoria, v => ss.categoria = v, { options: [[null, '—'], ['B', 'B'], ['1', '1'], ['2', '2'], ['3', '3'], ['4', '4']] }) : null),
        ss.metodo === 'arch' && ss.categoria === '1' ? check('Componenti ben collaudati (ISO 13849-2)', () => ss.collaudati, v => ss.collaudati = v) : null,
        h('div', { class: 'row' }, h('span', { class: 'spacer' }),
          h('button', { onclick: () => { f.sottosistemi.splice(i, 1); render(); } }, 'Elimina sottosistema')))),
      h('div', { class: 'row' }, ...RUOLI.slice(0, 3).map(([r, t]) => h('button', { onclick: () => {
        f.sottosistemi.push({ id: uid(), nome: t.split(' (')[0], ruolo: r, percorso: '', metodo: r === 'rilevamento' ? 'arch' : 'pfh', categoria: null, componenti: [], ccf: {}, pfhK1: null });
        render(); } }, '+ ' + t.split(' (')[0]))),
    ] : null,
  ];
}

// ---- passo 3 ----
// tipologia di articolo adatta a ciascun ruolo di sottosistema
const TIPO_RUOLO = { rilevamento: 'sensore', logica: 'logica', attuazione: 'attuatore', comunicazione: 'comunicazione' };
const SEL = {}; // filtri del passo 3 per sottosistema: { testo, tutti }
function candidati(ss) {
  const s = SEL[ss.id] || {};
  const tipo = TIPO_RUOLO[ss.ruolo];
  return window.Archivio.filtra(A, { testo: s.testo, tipo: s.tutti ? '' : tipo });
}
function articleSelect(c, ss) {
  const groups = new Map();
  const lista = candidati(ss);
  const scelto = art(c.articoloId);
  if (scelto && !lista.includes(scelto)) lista.push(scelto); // l'articolo già scelto resta sempre visibile
  for (const a of lista.sort((x, y) => `${x.produttore}${x.codice}`.localeCompare(`${y.produttore}${y.codice}`))) {
    const k = a.produttore || '(senza produttore)';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(a);
  }
  return h('select', { onchange: e => { c.articoloId = e.target.value || null; render(); } },
    h('option', { value: '' }, '— scegli —'),
    [...groups].map(([g, list]) => h('optgroup', { label: g }, list.map(a =>
      h('option', { value: a.id, selected: a.id === c.articoloId }, `${a.codice} · ${a.descrizione || ''}${a.verificato ? '' : ' (da verificare)'}`)))));
}
function filtroArticoli(ss) {
  const s = SEL[ss.id] ||= { testo: '', tutti: false };
  const tipo = TIPO_RUOLO[ss.ruolo];
  const n = candidati(ss).length;
  return h('div', { class: 'row noprint', style: 'margin:0 0 8px;align-items:center;gap:12px' },
    h('input', { type: 'search', 'data-ss': ss.id, value: s.testo, placeholder: 'cerca codice, descrizione, costruttore', style: 'max-width:320px',
      oninput: e => { s.testo = e.target.value; clearTimeout(s.t); s.t = setTimeout(() => { render(); const i = document.querySelector(`input[data-ss="${ss.id}"]`); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); } }),
    h('label', { style: 'display:flex;gap:6px;align-items:center;font-size:13px' },
      h('input', { type: 'checkbox', checked: s.tutti, style: 'width:auto', onchange: e => { s.tutti = e.target.checked; render(); } }), 'tutte le tipologie'),
    h('span', { class: 'mute', style: 'font-size:13px' }, `${n} articoli${s.tutti || !tipo ? '' : ` di tipo "${tipo}" (ruolo ${ss.ruolo})`}`));
}
function step3() {
  const f = fn();
  return [
    h('h1', {}, '3. Componenti dall\'archivio'),
    h('p', { class: 'sub' }, 'Per ogni sottosistema scegli gli articoli. Se un articolo manca, aggiungilo in "Archivio articoli" con la sua fonte.'),
    fnTabs(),
    f ? f.sottosistemi.map(ss => {
      const arch = ss.metodo === 'arch';
      return h('section', {},
        h('h2', {}, ss.nome, h('span', { class: 'mute', style: 'font-weight:400' }, ` · ${arch ? 'architettura designata, cat. ' + (ss.categoria || '?') : 'PFH da certificato'}${ss.percorso ? ' · percorso ' + ss.percorso : ''}`)),
        filtroArticoli(ss),
        h('div', { class: 'scroll' }, h('table', {},
          h('thead', {}, h('tr', {}, h('th', {}, 'Articolo'), h('th', {}, 'Qtà'),
            arch ? [h('th', {}, 'Canale'), h('th', {}, 'DC %'), h('th', {}, 'Giorni/anno'), h('th', {}, 'Ore/giorno'), h('th', {}, 'Ciclo [s]')] : h('th', {}, 'PFH cad.'),
            h('th', {}, 'Fonte'), h('th', {}))),
          h('tbody', {}, ss.componenti.map((c, i) => {
            const a = art(c.articoloId);
            const b10 = a && a.mttfd == null && a.b10d != null;
            return h('tr', {},
              h('td', {}, h('div', { style: 'display:flex;gap:6px;align-items:center;min-width:280px' }, thumb(a), articleSelect(c, ss))),
              h('td', {}, field(null, () => c.qty, v => c.qty = v ?? 1, { type: 'number', min: 1 })),
              arch ? [
                h('td', {}, field(null, () => String(c.canale || 1), v => c.canale = Number(v), { options: [['1', '1'], ['2', '2']] })),
                h('td', {}, field(null, () => c.dc, v => c.dc = v, { type: 'number', min: 0, step: 'any' })),
                ...['dop', 'hop', 'tcycle'].map(k => h('td', {}, b10 ? field(null, () => c[k], v => c[k] = v, { type: 'number', min: 0, step: 'any' }) : h('span', { class: 'mute' }, '—'))),
              ] : h('td', {}, a ? (a.pfh == null ? h('span', { class: 'warn' }, 'mancante') : fmt(a.pfh) + '·10⁻⁹/h') : '—'),
              h('td', { class: 'mute', style: 'font-size:12px;max-width:260px' }, a ? (a.fonte || h('span', { class: 'warn' }, 'senza fonte')) : ''),

          })))),

    }) : null,

}

// ---- passo 4 ----
function step4() {

            h('span', {}, 'MTTFd del sottosistema'), h('span', {}, `${fmt(x.mttfd, 1)} anni (${x.mttfdLevel || '—'})`),
            h('span', {}, 'DCavg'), h('span', {}, `${fmt(x.dcavg, 1)} % (${x.dcLevel || '—'})`),
            h('span', {}, 'Categoria'), h('span', {}, ss.categoria || '—')),
          E.CATEGORIE[ss.categoria] && E.CATEGORIE[ss.categoria].ccf ? [
            h('h3', {}, `Guasti di causa comune: ${x.ccf} / 100 punti (minimo ${E.CCF_MIN})`),
            E.CCF_MEASURES.map(m => check(`${m.testo} (${m.punti})`, () => !!(ss.ccf || {})[m.id], v => { ss.ccf = ss.ccf || {}; ss.ccf[m.id] = v; })),
          ] : null,
          h('div', { class: 'grid', style: 'margin-top:10px' },
            field(`PFH da tab. K.1 per cat. ${ss.categoria || '?'}, DCavg ${x.dcLevel || '?'}, MTTFd ${fmt(x.mttfd, 0)} anni [10⁻⁹/h]`, () => ss.pfhK1, v => ss.pfhK1 = v, { type: 'number', min: 0, step: 'any' })),

}

// ---- passo 5 ----
function verdict(f, r) {

    h('div', { class: 'row', style: 'margin-top:0' }, h('h2', { style: 'margin:0' }, f.nome),

      h('tbody', {}, r.paths.map(p => h('tr', {}, h('td', {}, p.nome), h('td', {}, p.sottosistemi.join(' + ')),

}
function step5() {
  return [

// ---- passo 6 ----

}

}
function step6() {
  const p = S.progetto;

// ---- archivio ----
const TIPI = [['sensore', 'sensore'], ['logica', 'logica'], ['attuatore', 'attuatore'], ['comunicazione', 'comunicazione']];
const ART_COLS = [
  ['codice', 'Codice'], ['descrizione', 'Descrizione'], ['produttore', 'Produttore'], ['tipo', 'Tipo', TIPI],
  ['pfh', 'PFH [10⁻⁹/h]', 'number'], ['b10d', 'B10d [cicli]', 'number'], ['mttfd', 'MTTFd [anni]', 'number'],
  ['plMax', 'PL max', [[null, '—'], ['a', 'a'], ['b', 'b'], ['c', 'c'], ['d', 'd'], ['e', 'e']]],
  ['fonte', 'Fonte (documento, pagina)'], ['dataFonte', 'Data fonte'], ['note', 'Note'],
];
function pickFile(accept, cb) {
  h('input', { type: 'file', accept, onchange: async e => { const f = e.target.files[0]; if (f) await cb(f); } }).click();
}
// Librerie dei costruttori: SISTEMA (.slb, database Firebird), VDMA 66413 (.xml) o pacchetto .zip (VDMA + immagini)
async function leggiLibreria(f) {
  if (/\.xml$/i.test(f.name)) return window.Vdma.importa(await f.text());
  if (/\.zip$/i.test(f.name)) return window.Vdma.importaPacchetto(window.Zip.apri(new Uint8Array(await f.arrayBuffer())));
  return window.Sistema.importa(new Uint8Array(await f.arrayBuffer()));
}
function importLibreria() {
  pickFile('.slb,.xml,.zip', async f => {
    try {
      const r = await leggiLibreria(f);
      const u = window.Archivio.unisci(A, r.articoli);
      UI.importa = { file: f.name, ...r, nuovi: u.nuovi, aggiornati: u.aggiornati, invariati: u.invariati, articoli_unione: u.articoli };
    } catch (e) {
      UI.importa = { file: f.name, errore: [window.Sistema, window.Vdma, window.Zip].some(m => e instanceof m.FormatError) ? e.message : 'Lettura non riuscita: ' + e.message };
    }
    render();
  });
}
function importPanel() {
  const m = UI.importa;
  if (!m) return null;
  if (m.errore) return h('section', {}, h('h2', { class: 'bad' }, `${m.file}: non importato`), h('p', {}, m.errore),
    h('button', { onclick: () => { UI.importa = null; render(); } }, 'Chiudi'));
  const con = k => m.articoli.filter(a => a[k] != null).length;
  return h('section', {},
    h('h2', {}, `Libreria ${m.libreria}`),
    h('p', {}, `${m.articoli.length} articoli letti: ${con('pfh')} con PFH, ${con('b10d')} con B10d, ${con('mttfd')} con MTTFd. `,
      h('b', {}, `${m.nuovi} nuovi, ${m.aggiornati} aggiornati, ${m.invariati} già presenti.`)),
    m.articoli.some(a => /= (B10|MTTF) \/ RDF/.test(a.fonte)) ? h('p', { class: 'note' }, `${m.articoli.filter(a => /= (B10|MTTF) \/ RDF/.test(a.fonte)).length} articoli danno B10 o MTTF con la quota di guasti pericolosi (RDF): B10d e MTTFd sono ricavati come B10 / RDF e MTTF / RDF, con il calcolo scritto nella fonte.`) : null,
    m.immagini ? h('p', {}, `${m.immagini.size} immagini trovate nel pacchetto per ${m.articoli.filter(a => a.immagine).length} articoli` +
      (m.immaginiMancanti ? `; ${m.immaginiMancanti} articoli citano un'immagine che nello .zip non c'è.` : '.')) : null,
    m.scartati.length ? h('details', {}, h('summary', {}, `${m.scartati.length} voci scartate`), h('ul', { class: 'list' }, m.scartati.map(([w, n]) => h('li', {}, `${n}: ${w}`)))) : null,
    h('p', { class: 'note' }, 'Gli articoli entrano come "da verificare": confronta i valori con la documentazione del costruttore prima di usarli in un documento. Se un valore cambia rispetto all\'archivio, l\'articolo torna da verificare.'),
    h('div', { class: 'row' },
      h('button', { class: 'p', onclick: async e => {
        e.target.disabled = true;
        if (m.immagini && m.immagini.size) {
          let ok = false;
          UI.avvisoImmagini = null;
          try { ok = await salvaImmagini(m.immagini); } catch (err) { UI.avvisoImmagini = err.message; }
          if (!ok) { UI.avvisoImmagini ||= 'Immagini non salvate: lo spazio del browser non basta, avvia l\'app con npm start.'; m.articoli_unione.forEach(a => { if (a.immagine && !IMG[a.immagine]) delete a.immagine; }); }
        }
        A = m.articoli_unione; UI.importa = null; UI.produttore = m.articoli[0]?.produttore || ''; render();
      } }, 'Aggiungi all\'archivio'),
      h('button', { onclick: () => { UI.importa = null; render(); } }, 'Annulla')));
}
function editPanel() {
  const a = A.find(x => x.id === UI.edit);
  if (!a) return null;
  return h('section', {},
    h('div', { class: 'row', style: 'margin-top:0' }, h('h2', { style: 'margin:0' }, `Modifica ${a.codice}`), h('span', { class: 'spacer' }),
      h('button', { onclick: () => { UI.edit = null; render(); } }, 'Chiudi')),
    h('div', { class: 'grid', style: 'margin-top:10px' }, ART_COLS.map(([k, t, o]) =>
      field(t, () => a[k], v => a[k] = v, Array.isArray(o) ? { options: o } : { type: o || 'text', step: 'any', min: 0 }))),
    check('Verificato sul documento originale', () => a.verificato, v => a.verificato = v),
    a.libreria ? h('p', { class: 'note' }, `Importato dalla libreria ${a.libreria}.`) : null,
    imgSrc(a) ? h('p', {}, thumb(a, 160)) : null);
}
function stepDb() {
  const prod = window.Archivio.perProduttore(A);
  const list = window.Archivio.filtra(A, UI).sort((x, y) => `${x.produttore}${x.codice}`.localeCompare(`${y.produttore}${y.codice}`));
  const where = DB.mode === 'server'
    ? h('span', { class: 'ok' }, `Archivio salvato sul PC in ${DB.file}`)
    : h('span', { class: 'warn' }, 'Archivio salvato solo in questo browser: avvia l\'app con npm start per salvarlo in un file.');
  return [
    h('h1', {}, 'Archivio articoli'),
    h('p', { class: 'sub' }, 'Ogni valore deve venire da un certificato, da un documento o da una libreria del costruttore. Spunta "verificato" solo dopo averlo confrontato con l\'originale. I campi vuoti non vengono mai riempiti con valori tipici.'),
    h('p', { style: 'margin:-8px 0 12px;font-size:13px' }, where, DB.error ? h('span', { class: 'bad' }, ' · ' + DB.error) : null,
      UI.avvisoImmagini ? h('span', { class: 'bad' }, ' · ' + UI.avvisoImmagini) : null),
    h('div', { class: 'row noprint', style: 'margin:0 0 12px' },
      h('button', { class: 'p', onclick: importLibreria }, 'Importa libreria costruttore (SISTEMA .slb, VDMA .xml o .zip)'),
      h('button', { onclick: () => importFile(d => { if (!Array.isArray(d)) throw new Error('serve un elenco di articoli'); d.forEach(a => { a.id ||= uid(); }); A = window.Archivio.unisci(A, d).articoli; }) }, 'Importa JSON'),
      h('button', { onclick: () => download('archivio-articoli.json', JSON.stringify(list, null, 2)) }, `Esporta ${list.length === A.length ? 'tutto' : 'i ' + list.length + ' filtrati'}`),
      h('button', { onclick: () => { const a = { id: uid(), codice: 'Nuovo articolo', descrizione: '', produttore: UI.produttore || '', tipo: UI.tipo || 'sensore', pfh: null, b10d: null, mttfd: null, plMax: null, fonte: '', dataFonte: '', verificato: false, note: '' }; A.push(a); UI.edit = a.id; render(); } }, 'Aggiungi articolo')),
    importPanel(),
    h('section', {}, h('h2', {}, 'Costruttori'), h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Costruttore', 'Articoli', 'Per tipologia', 'Da verificare', 'Librerie', ''].map(t => h('th', {}, t)))),
      h('tbody', {}, prod.map(r => h('tr', { class: UI.produttore === r.produttore ? 'sel' : '' },
        h('td', {}, h('a', { href: '#', onclick: e => { e.preventDefault(); UI.produttore = UI.produttore === r.produttore ? '' : r.produttore; UI.limite = 100; render(); } }, r.produttore)),
        h('td', {}, r.articoli),
        h('td', { style: 'font-size:13px' }, Object.entries(r.tipi).map(([t, n]) => `${t} ${n}`).join(' · ')),
        h('td', { class: r.daVerificare ? 'warn' : 'ok' }, r.daVerificare),
        h('td', { style: 'font-size:12px' }, r.librerie.join(', ') || '—'),
        h('td', {}, h('button', { onclick: () => { if (confirm(`Eliminare tutti i ${r.articoli} articoli di ${r.produttore}? Le valutazioni che li usano resteranno senza dati.`)) { A = A.filter(a => (a.produttore || '(senza produttore)') !== r.produttore); if (UI.produttore === r.produttore) UI.produttore = ''; render(); } } }, 'Elimina')))))))),
    editPanel(),
    h('section', {},
      h('div', { class: 'grid' },
        h('label', {}, 'Cerca', h('input', { type: 'search', value: UI.testo, placeholder: 'codice, descrizione, serie', oninput: e => { UI.testo = e.target.value; UI.limite = 100; clearTimeout(UI.t); UI.t = setTimeout(() => { render(); const i = document.querySelector('input[type=search]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); } })),
        field('Costruttore', () => UI.produttore, v => { UI.produttore = v || ''; UI.limite = 100; }, { options: [[null, 'tutti'], ...prod.map(r => [r.produttore, `${r.produttore} (${r.articoli})`])] }),
        field('Tipologia', () => UI.tipo, v => { UI.tipo = v || ''; UI.limite = 100; }, { options: [[null, 'tutte'], ...TIPI] })),
      check('Solo da verificare', () => UI.daVerificare, v => { UI.daVerificare = v; UI.limite = 100; }),
      h('p', { class: 'note' }, `${list.length} articoli su ${A.length}.`),
      h('div', { class: 'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, ['', 'Codice', 'Descrizione', 'Costruttore', 'Tipo', 'PFH', 'B10d', 'MTTFd', 'Verificato', ''].map(t => h('th', {}, t)))),
        h('tbody', {}, list.slice(0, UI.limite).map(a => h('tr', {},
          h('td', {}, thumb(a, 32)), h('td', {}, a.codice), h('td', { style: 'font-size:13px' }, a.descrizione || ''), h('td', { style: 'font-size:13px' }, a.produttore || ''), h('td', {}, a.tipo || ''),
          h('td', {}, fmt(a.pfh)), h('td', {}, fmt(a.b10d, 0)), h('td', {}, fmt(a.mttfd, 1)),
          h('td', {}, h('input', { type: 'checkbox', checked: a.verificato, style: 'width:auto', title: a.fonte || 'senza fonte', onchange: e => { a.verificato = e.target.checked; render(); } })),
          h('td', { style: 'white-space:nowrap' },
            h('button', { onclick: () => { UI.edit = a.id; render(); window.scrollTo(0, 0); } }, 'Modifica'), ' ',
            h('button', { onclick: () => { if (confirm(`Eliminare ${a.codice}?`)) { A = A.filter(x => x !== a); render(); } } }, '×'))))))),
      list.length > UI.limite ? h('div', { class: 'row' }, h('button', { onclick: () => { UI.limite += 200; render(); } }, `Mostra altri (${list.length - UI.limite})`)) : null),
  ];
}

let rendering = false;
function render() {
  // un change che scatta sul blur mentre si sostituisce il DOM ridisegna dopo, non durante
  if (rendering) { setTimeout(render); return; }
  rendering = true;
  try { draw(); } finally { rendering = false; }
}
function draw() {
  save();
  saveArchive();
  document.getElementById('nav').replaceChildren(...STEPS.map(([k, t]) =>
    h('button', { class: S.step === k ? 'on' : '', onclick: () => go(k) }, typeof k === 'number' ? `${k}. ${t}` : t)));
  const views = { 1: step1, 2: step2, 3: step3, 4: step4, 5: step5, 6: step6, db: stepDb };
  const y = window.scrollY;
  document.getElementById('app').replaceChildren(h('div', {}, (views[S.step] || step1)(), S.step !== 'db' ? navButtons() : null));
  window.scrollTo(0, y);
}
loadArchive().then(render, e => { DB.error = e.message; render(); });
